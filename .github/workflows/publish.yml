name: publish
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "artifact id holding the IPA"
        default: "12553512884"
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch artifact
        env:
          PAT: ${{ secrets.HUSK_PAT }}
        run: |
          set -e
          curl -sSL -H "Authorization: token $PAT" \
            "https://api.github.com/repos/jifz/ci-probe-tmp/actions/artifacts/${{ inputs.artifact_id }}/zip" -o a.zip
          ls -l a.zip
          mkdir -p out && unzip -o -q a.zip -d out
          ls -l out

      - name: Create release
        env:
          PAT: ${{ secrets.HUSK_PAT }}
        run: |
          set -e
          SHA=$(curl -sS -H "Authorization: token $PAT" https://api.github.com/repos/jifz/Husk-ZH/commits/main | jq -r .sha)
          jq -n --arg sha "$SHA" '{
            tag_name: "zh-3.0",
            name: "Husk 3.0 简体中文版",
            body: "界面文案已本地化为简体中文。未签名，请用 SideStore / AltStore / TrollStore 安装。",
            target_commitish: $sha, draft: false, prerelease: false
          }' > rel.json
          curl -sS -X POST -H "Authorization: token $PAT" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" --data-binary @rel.json \
            https://api.github.com/repos/jifz/Husk-ZH/releases -o resp.json
          jq -r '.id, .upload_url' resp.json
          jq -r '.upload_url' resp.json | cut -d'{' -f1 > upload.txt

      - name: Upload assets
        env:
          PAT: ${{ secrets.HUSK_PAT }}
        run: |
          set -e
          UP=$(cat upload.txt)
          for f in out/*.ipa out/*.tipa; do
            [ -f "$f" ] || continue
            name=$(basename "$f" | sed 's/^Husk/Husk-zh/')
            curl -sS -X POST -H "Authorization: token $PAT" -H "Content-Type: application/zip" \
              --data-binary @"$f" "$UP?name=$name" -o /dev/null -w "$name %{http_code}\n"
          done
          echo "https://github.com/jifz/Husk-ZH/releases/tag/zh-3.0"
