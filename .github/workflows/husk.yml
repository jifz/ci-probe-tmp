name: husk
on:
  workflow_dispatch:
    inputs:
      source:
        description: "upstream | private"
        default: private
        type: choice
        options: [upstream, private]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - name: Fetch source
        env:
          PAT: ${{ secrets.HUSK_PAT }}
        run: |
          set -e
          if [ "${{ inputs.source }}" = "private" ]; then
            curl -fsSL -H "Authorization: token $PAT" \
              https://codeload.github.com/jifz/Husk-ZH/tar.gz/refs/heads/main -o src.tgz
          else
            curl -fsSL https://codeload.github.com/Leviidev/Husk/tar.gz/refs/heads/main -o src.tgz
          fi
          file src.tgz 2>/dev/null || ls -l src.tgz
          mkdir -p src && tar xzf src.tgz -C src --strip-components=1
          cd src && git init -q && git add -A >/dev/null 2>&1 || true
          git -c user.email=b@b -c user.name=b commit -qm snapshot >/dev/null 2>&1 || true
          du -sh . ; ls

      - name: Host tooling
        run: |
          set -x
          brew install meson ninja pkg-config xcodegen cmake qemu || true
          which qemu-img && qemu-img --version | head -1
          /opt/homebrew/bin/python3 -m pip install --break-system-packages --quiet pyyaml || pip3 install --break-system-packages pyyaml || true
          /opt/homebrew/bin/python3 -c "import yaml; print('yaml ok')"
          which meson ninja pkg-config xcodegen cmake
          rustup target add aarch64-apple-ios || true
          meson --version; ninja --version

      - name: Restore caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src/third_party/sources
            src/third_party/build
            src/build
            src/third_party/gpu
          key: husk-v2-${{ github.run_id }}
          restore-keys: husk-v2-

      - name: Seed prebuilt PS4 layer
        working-directory: src
        run: |
          set -e
          if [ -f build/ios-arm64/lib/libhuskps4.dylib ]; then echo "libhuskps4 already present"; exit 0; fi
          curl -fL --retry 3 -o official.ipa https://github.com/Leviidev/Husk/releases/download/3.0/Husk.ipa
          mkdir -p off && unzip -q official.ipa -d off
          APP=off/Payload/Husk.app
          mkdir -p build/ios-arm64/lib
          cp "$APP/Frameworks/libhuskps4.dylib" build/ios-arm64/lib/
          if [ -d "$APP/java-runtime" ]; then rm -rf build/java-runtime; cp -R "$APP/java-runtime" build/java-runtime; fi
          if [ -d "$APP/android-system" ]; then rm -rf build/android-system; cp -R "$APP/android-system" build/android-system; fi
          rm -rf off official.ipa
          ls -la build/ios-arm64/lib/

      - name: Build
        working-directory: src
        run: |
          set -o pipefail
          date
          ./scripts/ci_build.sh "$PWD/out/Husk.ipa" 2>&1 | tee build-all.log | tail -n 400
          date

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            src/third_party/sources
            src/third_party/build
            src/build
            src/third_party/gpu
          key: husk-v2-${{ github.run_id }}

      - name: Logs on failure
        if: failure() || cancelled()
        working-directory: src
        run: |
          tail -n 120 build-all.log || true
          for f in build/logs/*.log; do echo "##### $f"; tail -n 60 "$f"; done || true

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: husk-ipa
          path: |
            src/out/Husk.ipa
            src/out/Husk.tipa
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: husk-log
          path: |
            src/build-all.log
            src/build/logs
          if-no-files-found: warn
