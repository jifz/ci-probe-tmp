name: verify
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Download + inspect
        env:
          PAT: ${{ secrets.HUSK_PAT }}
        run: |
          set -e
          curl -sSL -H "Authorization: token $PAT" -o h.ipa \
            https://github.com/jifz/Husk-ZH/releases/download/zh-3.0/Husk-zh.ipa
          ls -l h.ipa
          unzip -q h.ipa -d ex
          APP=ex/Payload/Husk.app
          echo "--- bundle ---"
          ls "$APP" | head -20
          echo "--- info ---"
          python3 -c "
import plistlib,sys
p=plistlib.load(open('$APP/Info.plist','rb'))
for k in ['CFBundleIdentifier','CFBundleShortVersionString','CFBundleVersion','MinimumOSVersion','HuskBuildCommit','HuskBuildDate']:
    print(k, '=', p.get(k))
"
          echo "--- chinese strings in binary ---"
          strings "$APP/Husk" | grep -c '[一-龥]' || true
          strings "$APP/Husk" | grep -m 8 '[一-龥]'
          echo "--- qemu dylib ---"
          ls -l "$APP/Frameworks" | head
