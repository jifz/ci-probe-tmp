name: verify
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Download + inspect
        env:
          PAT: ${{ secrets.HUSK_PAT }}
        run: |
          set -e
          curl -sSL -H "Authorization: token $PAT" -H "Accept: application/octet-stream" -o h.ipa \
            https://api.github.com/repos/jifz/Husk-ZH/releases/assets/671787119
          ls -l h.ipa
          unzip -q h.ipa -d ex
          APP=ex/Payload/Husk.app
          echo "--- bundle ---"
          ls "$APP" | head -25
          echo "--- info ---"
          python3 -c "import plistlib,sys; p=plistlib.load(open('$APP/Info.plist','rb')); [print(k,'=',p.get(k)) for k in ['CFBundleIdentifier','CFBundleShortVersionString','CFBundleVersion','MinimumOSVersion','HuskBuildCommit','HuskBuildDate']]"
          echo "--- chinese string count in binary ---"
          strings "$APP/Husk" | grep -c '[^ -~]' || true
          strings "$APP/Husk" | grep -m 10 '[一-龥]' || true
          echo "--- frameworks ---"
          ls -l "$APP/Frameworks" | head -12
